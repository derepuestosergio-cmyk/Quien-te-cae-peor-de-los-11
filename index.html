<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votación Anónima</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060409 100%);
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-color: #ff4757;
            --accent-glow: rgba(255, 71, 87, 0.4);
            --text-main: #ffffff;
            --text-muted: #a1a1a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Contenedor Principal con animación de entrada */
        .container {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Sección de Votación */
        .vote-section {
            display: none; /* Se muestra por JS si es nuevo */
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: slideDown 0.5s ease;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-vote {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-vote:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
            background: #ff6b81;
        }

        .btn-vote:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Estado de "Ya votaste" */
        .already-voted-msg {
            display: none;
            text-align: center;
            color: #2ed573;
            font-size: 0.95rem;
            margin-bottom: 30px;
            padding: 12px;
            background: rgba(46, 213, 115, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(46, 213, 115, 0.2);
            font-weight: 600;
        }

        /* Tabla de clasificación (Barras) */
        .results-section {
            margin-top: 20px;
        }

        .results-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bar-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            padding: 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .bar-row:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .bar-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .bar-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Estilos de las medallas */
        .medal {
            font-size: 1.2rem;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        .bar-votes {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .bar-track {
            background: rgba(255, 255, 255, 0.05);
            height: 14px;
            border-radius: 7px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .bar-fill {
            background: linear-gradient(90deg, #ff4757, #ffa502);
            height: 100%;
            width: 0%; /* Animado por JS */
            border-radius: 7px;
            transition: width 0.8s cubic-bezier(0.1, 1, 0.1, 1);
        }

        /* Colores especiales de barra para el podio */
        .top-0 .bar-fill {
            background: linear-gradient(90deg, #ffd700, #ffa502); /* Oro */
        }
        .top-1 .bar-fill {
            background: linear-gradient(90deg, #ced4da, #6c757d); /* Plata */
        }
        .top-2 .bar-fill {
            background: linear-gradient(90deg, #cd7f32, #a0522d); /* Bronce */
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¿Quién te cae peor de los 11?</h1>

        <div id="alreadyVotedMsg" class="already-voted-msg">
            🔒 Tu voto ha sido registrado. Solo se permite un voto por IP.
        </div>

        <div id="voteSection" class="vote-section">
            <div class="input-group">
                <label for="nameInput">Escribe un nombre o selecciona uno de la lista:</label>
                <input type="text" id="nameInput" placeholder="Ej. Juan, Pedro..." maxlength="30">
            </div>
            <button id="voteBtn" class="btn-vote">VOTAR</button>
        </div>

        <div class="results-section">
            <div class="results-title">🏆 Posiciones en Tiempo Real:</div>
            <div id="loading" class="loading">Cargando datos de Firebase...</div>
            <div id="resultsContainer" class="results-container"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuración de tu base de datos
        const firebaseConfig = {
            apiKey: "AIzaSyDw6ZyDc49RjRZJyycHnUtQF2AeOH4dxvY",
            authDomain: "quien-te-cae-peor-del-salon.firebaseapp.com",
            databaseURL: "https://quien-te-cae-peor-del-salon-default-rtdb.firebaseio.com",
            projectId: "quien-te-cae-peor-del-salon",
            storageBucket: "quien-te-cae-peor-del-salon.firebasestorage.app",
            messagingSenderId: "601892089622",
            appId: "1:601892089622:web:e88826090713f64dbe6a37",
            measurementId: "G-HCGM5FWBHJ"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Nodos Directos
        const votesRef = ref(db, 'Votos');

        // Elementos del DOM
        const voteSection = document.getElementById('voteSection');
        const alreadyVotedMsg = document.getElementById('alreadyVotedMsg');
        const nameInput = document.getElementById('nameInput');
        const voteBtn = document.getElementById('voteBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const loadingStr = document.getElementById('loading');

        let userIpSanitized = "";
        let hasVoted = false;
        let globalVotesData = {};

        // 1. Validar la IP única del votante
        async function checkUserStatus() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIpSanitized = data.ip.replace(/\./g, '_');

                const ipSnapshot = await get(ref(db, `Ips_Votadas/${userIpSanitized}`));
                
                if (ipSnapshot.exists() || localStorage.getItem('voted_local')) {
                    hasVoted = true;
                    alreadyVotedMsg.style.display = 'block';
                    voteSection.style.display = 'none';
                } else {
                    voteSection.style.display = 'block';
                }
            } catch (error) {
                console.error("Error al validar la IP:", error);
                if(localStorage.getItem('voted_local')) {
                    hasVoted = true;
                    alreadyVotedMsg.style.display = 'block';
                    voteSection.style.display = 'none';
                } else {
                    voteSection.style.display = 'block';
                }
            }
        }

        // 2. Escuchar cambios de Firebase y renderizar con Medallas
        onValue(votesRef, (snapshot) => {
            loadingStr.style.display = 'none';
            resultsContainer.innerHTML = "";
            
            if (!snapshot.exists()) {
                globalVotesData = {};
                resultsContainer.innerHTML = "<p style='text-align:center; font-size:0.9rem; color:#a1a1a1;'>Aún no hay votos registrados.</p>";
                return;
            }

            globalVotesData = snapshot.val();
            
            // Ordenar de mayor a menor
            const sortedResults = Object.keys(globalVotesData).map(name => {
                return { name: name, votes: globalVotesData[name] };
            }).sort((a, b) => b.votes - a.votes);

            const maxVotes = Math.max(...sortedResults.map(r => r.votes), 1);
            const totalGeneralVotos = sortedResults.reduce((acc, curr) => acc + curr.votes, 0);

            // Generar filas dinámicas con medallas en el top 3
            sortedResults.forEach((item, index) => {
                const percentage = (item.votes / maxVotes) * 100;
                const percentageReal = Math.round((item.votes / totalGeneralVotos) * 100);

                // Asignar medallas según el índice
                let medalHtml = "";
                if (index === 0) medalHtml = '<span class="medal">🥇</span> ';
                else if (index === 1) medalHtml = '<span class="medal">🥈</span> ';
                else if (index === 2) medalHtml = '<span class="medal">🥉</span> ';

                const barRow = document.createElement('div');
                // Agrega clases especiales top-0, top-1, top-2 para cambiar color de barra
                barRow.className = `bar-row ${index < 3 ? 'top-' + index : ''}`;
                
                barRow.onclick = () => {
                    if(!hasVoted) {
                        nameInput.value = item.name;
                        nameInput.focus();
                    }
                };

                barRow.innerHTML = `
                    <div class="bar-info">
                        <span class="bar-name">${medalHtml}${item.name}</span>
                        <span class="bar-votes">${item.votes} ${item.votes === 1 ? 'voto' : 'votos'} (${percentageReal}%)</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${percentage}%"></div>
                    </div>
                `;
                resultsContainer.appendChild(barRow);
            });
        });

        // 3. Procesar Envío del Voto Directo
        voteBtn.addEventListener('click', async () => {
            const rawName = nameInput.value.trim();
            
            if (!rawName) {
                alert("Por favor, escribe o selecciona un nombre válido.");
                return;
            }

            const sanitizedName = rawName.replace(/[\.#\$\[\]]/g, "").trim();

            if (sanitizedName.length === 0) {
                alert("Nombre no válido.");
                return;
            }

            voteBtn.disabled = true;
            voteBtn.innerText = "PROCESANDO...";

            try {
                if (userIpSanitized) {
                    const ipSnapshot = await get(ref(db, `Ips_Votadas/${userIpSanitized}`));
                    if (ipSnapshot.exists()) {
                        alert("Esta dirección IP ya registró un voto.");
                        location.reload();
                        return;
                    }
                }

                const currentVotes = globalVotesData[sanitizedName] || 0;
                const newVotesValue = currentVotes + 1;

                // Guardado directo en /Votos/Nombre
                await set(ref(db, `Votos/${sanitizedName}`), newVotesValue);

                if (userIpSanitized) {
                    await set(ref(db, `Ips_Votadas/${userIpSanitized}`), true);
                }

                localStorage.setItem('voted_local', 'true');
                hasVoted = true;

                nameInput.value = "";
                voteSection.style.display = 'none';
                alreadyVotedMsg.style.display = 'block';

            } catch (error) {
                console.error("Error al votar: ", error);
                alert("Inconveniente: " + error.message);
                voteBtn.disabled = false;
                voteBtn.innerText = "VOTAR";
            }
        });

        checkUserStatus();
    </script>
</body>
</html>
