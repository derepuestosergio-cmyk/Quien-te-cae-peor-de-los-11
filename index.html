<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votación Anónima</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060409 100%);
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-color: #ff4757;
            --accent-glow: rgba(255, 71, 87, 0.4);
            --text-main: #ffffff;
            --text-muted: #a1a1a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Contenedor Principal con animación de entrada */
        .container {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Sección de Identificación Inicial */
        .user-auth-section {
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: slideDown 0.5s ease;
        }

        /* Sección de Votación */
        .vote-section {
            display: none; /* Se muestra por JS si es nuevo */
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: slideDown 0.5s ease;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input[type="text"], textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea {
            resize: none;
            height: 90px;
            font-size: 0.95rem;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Opción Modo Incógnito */
        .incognito-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            user-select: none;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .incognito-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .incognito-group span {
            font-size: 0.9rem;
            font-weight: 600;
            color: #eee;
        }

        .btn-vote {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-vote:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
            background: #ff6b81;
        }

        .btn-vote:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Estado de "Ya votaste" */
        .already-voted-msg {
            display: none;
            text-align: center;
            color: #2ed573;
            font-size: 0.95rem;
            margin-bottom: 30px;
            padding: 12px;
            background: rgba(46, 213, 115, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(46, 213, 115, 0.2);
            font-weight: 600;
        }

        /* Tabla de clasificación (Barras) */
        .results-section {
            margin-top: 20px;
        }

        .results-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bar-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            padding: 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .bar-row:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-expand {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-expand:hover {
            background: var(--accent-color);
            border-color: transparent;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .bar-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            flex-grow: 1;
            margin-right: 12px;
        }

        .bar-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Estilos de las medallas */
        .medal {
            font-size: 1.2rem;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        .bar-votes {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .bar-track {
            background: rgba(255, 255, 255, 0.05);
            height: 14px;
            border-radius: 7px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .bar-fill {
            background: linear-gradient(90deg, #ff4757, #ffa502);
            height: 100%;
            width: 0%; /* Animado por JS */
            border-radius: 7px;
            transition: width 0.8s cubic-bezier(0.1, 1, 0.1, 1);
        }

        /* Desglose de votantes públicos */
        .voters-details-list {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.4s ease-out;
        }

        .voter-detail-item {
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 6px;
        }

        .voter-detail-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .voter-detail-name {
            font-weight: 600;
            color: #ff6b81;
        }

        .voter-detail-reason {
            color: #d1d1d1;
            font-style: italic;
            display: block;
            margin-top: 2px;
            padding-left: 5px;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Colores especiales de barra para el podio */
        .top-0 .bar-fill {
            background: linear-gradient(90deg, #ffd700, #ffa502); /* Oro */
        }
        .top-1 .bar-fill {
            background: linear-gradient(90deg, #ced4da, #6c757d); /* Plata */
        }
        .top-2 .bar-fill {
            background: linear-gradient(90deg, #cd7f32, #a0522d); /* Bronce */
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¿Quién te cae mal del Hugo J Bermudes?</h1>

        <div id="authSection" class="user-auth-section">
            <div class="input-group">
                <label for="usernameInput">Ingresa tu nombre antes de ver o votar:</label>
                <input type="text" id="usernameInput" placeholder="Tu nombre o apodo..." maxlength="25">
            </div>
            <button id="authBtn" class="btn-vote">INGRESAR</button>
        </div>

        <div id="alreadyVotedMsg" class="already-voted-msg">
            🔒 Tu voto ha sido registrado. Solo se permite un voto por IP.
        </div>

        <div id="voteSection" class="vote-section">
            <div class="input-group">
                <label id="voteInstructionsLabel" for="nameInput">Escribe un nombre o selecciona uno de la lista:</label>
                <input type="text" id="nameInput" placeholder="Ej. Juan, Pedro..." maxlength="30">
            </div>
            
            <div class="input-group">
                <label for="reasonInput">¿Por qué te cae mal? (Obligatorio):</label>
                <textarea id="reasonInput" placeholder="Escribe tus motivos aquí... (Campo obligatorio)" maxlength="150"></textarea>
            </div>

            <label class="incognito-group">
                <input type="checkbox" id="incognitoCheck">
                <span>Modo incógnito (Ocultar mi nombre de la lista pública)</span>
            </label>

            <button id="voteBtn" class="btn-vote">VOTAR</button>
        </div>

        <div class="results-section">
            <div class="results-title">🏆 Posiciones en Tiempo Real:</div>
            <div id="loading" class="loading">Cargando datos de Firebase...</div>
            <div id="resultsContainer" class="results-container"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuración de tu base de datos
        const firebaseConfig = {
            apiKey: "AIzaSyDw6ZyDc49RjRZJyycHnUtQF2AeOH4dxvY",
            authDomain: "quien-te-cae-peor-del-salon.firebaseapp.com",
            databaseURL: "https://quien-te-cae-peor-del-salon-default-rtdb.firebaseio.com",
            projectId: "quien-te-cae-peor-del-salon",
            storageBucket: "quien-te-cae-peor-del-salon.firebasestorage.app",
            messagingSenderId: "601892089622",
            appId: "1:601892089622:web:e88826090713f64dbe6a37",
            measurementId: "G-HCGM5FWBHJ"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Nodos Directos Estructurados
        const votesRef = ref(db, 'Votos');
        const detailsRef = ref(db, 'Detalles_Votos');

        // Elementos del DOM
        const authSection = document.getElementById('authSection');
        const usernameInput = document.getElementById('usernameInput');
        const authBtn = document.getElementById('authBtn');
        const voteSection = document.getElementById('voteSection');
        const alreadyVotedMsg = document.getElementById('alreadyVotedMsg');
        const nameInput = document.getElementById('nameInput');
        const reasonInput = document.getElementById('reasonInput');
        const incognitoCheck = document.getElementById('incognitoCheck');
        const voteBtn = document.getElementById('voteBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const loadingStr = document.getElementById('loading');
        const voteInstructionsLabel = document.getElementById('voteInstructionsLabel');

        let userIpSanitized = "";
        let hasVoted = false;
        let globalVotesData = {};
        let globalDetailsData = {};
        let currentSessionName = "";
        
        // Estructura para almacenar los nombres por los que este usuario ya votó
        let personasVotadasPorUsuario = [];

        // Almacenamiento local del nombre para evitar pedirlo en refrescos del mismo dispositivo
        if (localStorage.getItem('saved_username')) {
            currentSessionName = localStorage.getItem('saved_username');
            authSection.style.display = 'none';
        } else {
            voteSection.style.display = 'none';
        }

        // Evento de ingreso de usuario inicial
        authBtn.addEventListener('click', () => {
            const enteredName = usernameInput.value.trim();
            if (!enteredName) {
                alert("Por favor introduce un nombre válido para continuar.");
                return;
            }
            currentSessionName = enteredName;
            localStorage.setItem('saved_username', enteredName);
            authSection.style.display = 'none';
            checkUserStatus();
        });

        // 1. Validar la IP única del votante y verificar cuántos votos lleva hechos
        async function checkUserStatus() {
            if (!currentSessionName) return;
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIpSanitized = data.ip.replace(/\./g, '_');

                // Consultar en Firebase cuántos votos ya registró esta IP
                const userVotesSnapshot = await get(ref(db, `Historial_Votantes_IP/${userIpSanitized}`));
                
                personasVotadasPorUsuario = [];
                if (userVotesSnapshot.exists()) {
                    personasVotadasPorUsuario = Object.keys(userVotesSnapshot.val());
                }

                // Si ya completó sus 5 votos permitidos, cerramos el formulario
                if (personasVotadasPorUsuario.length >= 5) {
                    hasVoted = true;
                    alreadyVotedMsg.innerText = "🔒 Ya has alcanzado el límite máximo de 5 votos permitidos por persona.";
                    alreadyVotedMsg.style.display = 'block';
                    voteSection.style.display = 'none';
                } else {
                    hasVoted = false;
                    alreadyVotedMsg.style.display = 'none';
                    voteSection.style.display = 'block';
                    actualizarContadorLabel();
                }
            } catch (error) {
                console.error("Error al validar la IP:", error);
                // Respaldo por si falla la API externa
                if(localStorage.getItem('voted_local_count')) {
                    const localCount = parseInt(localStorage.getItem('voted_local_count'), 10) || 0;
                    if (localCount >= 5) {
                        hasVoted = true;
                        alreadyVotedMsg.innerText = "🔒 Ya has alcanzado el límite máximo de 5 votos permitidos.";
                        alreadyVotedMsg.style.display = 'block';
                        voteSection.style.display = 'none';
                    } else {
                        voteSection.style.display = 'block';
                    }
                } else {
                    voteSection.style.display = 'block';
                }
            }
        }

        // Helper para refrescar las instrucciones en pantalla
        function actualizarContadorLabel() {
            const restantes = 5 - personasVotadasPorUsuario.length;
            voteInstructionsLabel.innerText = `Escribe un nombre o selecciona uno de la lista (Te quedan ${restantes} votos disponibles):`;
        }

        // Cargar los motivos y personas que votaron en tiempo real desde un nodo secundario
        onValue(detailsRef, (snapshot) => {
            if (snapshot.exists()) {
                globalDetailsData = snapshot.val();
            } else {
                globalDetailsData = {};
            }
        });

        // 2. Escuchar cambios de Firebase y renderizar con Medallas y Desglose Abierto
        onValue(votesRef, (snapshot) => {
            loadingStr.style.display = 'none';
            resultsContainer.innerHTML = "";
            
            if (!snapshot.exists()) {
                globalVotesData = {};
                resultsContainer.innerHTML = "<p style='text-align:center; font-size:0.9rem; color:#a1a1a1;'>Aún no hay votos registrados.</p>";
                return;
            }

            globalVotesData = snapshot.val();
            
            // Ordenar de mayor a menor
            const sortedResults = Object.keys(globalVotesData).map(name => {
                return { name: name, votes: globalVotesData[name] };
            }).sort((a, b) => b.votes - a.votes);

            const maxVotes = Math.max(...sortedResults.map(r => r.votes), 1);
            const totalGeneralVotos = sortedResults.reduce((acc, curr) => acc + curr.votes, 0);

            // Generar filas dinámicas con medallas en el top 3
            sortedResults.forEach((item, index) => {
                const percentage = (item.votes / maxVotes) * 100;
                const percentageReal = Math.round((item.votes / totalGeneralVotos) * 100);

                // Asignar medallas según el índice
                let medalHtml = "";
                if (index === 0) medalHtml = '<span class="medal">🥇</span> ';
                else if (index === 1) medalHtml = '<span class="medal">🥈</span> ';
                else if (index === 2) medalHtml = '<span class="medal">🥉</span> ';

                const barRow = document.createElement('div');
                barRow.className = `bar-row ${index < 3 ? 'top-' + index : ''}`;
                
                // Al hacer clic en la fila completa se selecciona automáticamente a la persona sin abrir los detalles
                barRow.onclick = (e) => {
                    if(!hasVoted && currentSessionName) {
                        nameInput.value = item.name;
                        reasonInput.focus();
                    }
                };

                // Construcción de la lista de detalles internos vinculados a este usuario
                let individualDetailsHtml = "";
                if (globalDetailsData[item.name]) {
                    Object.keys(globalDetailsData[item.name]).forEach(voterKey => {
                        const objectDetail = globalDetailsData[item.name][voterKey];
                        individualDetailsHtml += `
                            <div class="voter-detail-item">
                                <span class="voter-detail-name">👤 ${objectDetail.votoIncognito ? 'Incógnito' : objectDetail.votante}:</span>
                                <span class="voter-detail-reason">"${objectDetail.motivo}"</span>
                            </div>
                        `;
                    });
                } else {
                    individualDetailsHtml = `<div class="voter-detail-item" style="color:var(--text-muted);">No hay motivos públicos registrados.</div>`;
                }

                barRow.innerHTML = `
                    <div class="bar-header">
                        <div class="bar-info">
                            <span class="bar-name">${medalHtml}${item.name}</span>
                            <span class="bar-votes">${item.votes} ${item.votes === 1 ? 'voto' : 'votos'} (${percentageReal}%)</span>
                        </div>
                        <button class="btn-expand">Ver</button>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${percentage}%"></div>
                    </div>
                    <div class="voters-details-list">
                        <div style="font-size:0.8rem; font-weight:800; color:var(--text-muted); margin-bottom:4px; text-transform:uppercase;">Historial de votos y motivos:</div>
                        ${individualDetailsHtml}
                    </div>
                `;

                // Botón dedicado y aislado en la esquina para expandir o esconder los detalles
                const expandBtn = barRow.querySelector('.btn-expand');
                expandBtn.onclick = (e) => {
                    e.stopPropagation(); // Evita que se rellene el formulario de votación
                    const targetDetailsList = barRow.querySelector('.voters-details-list');
                    if(targetDetailsList) {
                        if(targetDetailsList.style.display === 'flex') {
                            targetDetailsList.style.display = 'none';
                            expandBtn.innerText = "Ver";
                        } else {
                            targetDetailsList.style.display = 'flex';
                            expandBtn.innerText = "Ocultar";
                        }
                    }
                };

                resultsContainer.appendChild(barRow);
            });
        });

        // 3. Procesar Envío del Voto con Motivos y Datos de Identificación Colectivos hasta un máximo de 5 personas
        voteBtn.addEventListener('click', async () => {
            if (!currentSessionName) {
                alert("Por favor, ingresa tu nombre arriba en el recuadro primero.");
                return;
            }

            const rawName = nameInput.value.trim();
            let rawReason = reasonInput.value.trim();
            const isIncognito = incognitoCheck.checked;
            
            if (!rawName) {
                alert("Por favor, escribe o selecciona un nombre válido.");
                return;
            }

            // OBLIGATORIEDAD DEL MOTIVO: Si el campo está vacío, detenemos la operación de inmediato
            if (!rawReason) {
                alert("Por favor, ingresa el motivo de tu voto. Es totalmente obligatorio decir por qué te cae mal.");
                return;
            }

            const sanitizedName = rawName.replace(/[\.#\$\[\]]/g, "").trim();

            if (sanitizedName.length === 0) {
                alert("Nombre no válido.");
                return;
            }

            // REGLA DE NO REPETIR: Comprobamos si el usuario actual ya nominó a esta persona específica
            if (personasVotadasPorUsuario.includes(sanitizedName)) {
                alert(`Ya has votado por "${sanitizedName}". Debes elegir a 5 personas diferentes.`);
                voteBtn.disabled = false;
                voteBtn.innerText = "VOTAR";
                return;
            }

            voteBtn.disabled = true;
            voteBtn.innerText = "PROCESANDO...";

            try {
                // Validación estricta en tiempo real consultando de nuevo Firebase para evitar bypass concurrente
                if (userIpSanitized) {
                    const currentStatusSnapshot = await get(ref(db, `Historial_Votantes_IP/${userIpSanitized}`));
                    let votosActualesServidor = [];
                    if (currentStatusSnapshot.exists()) {
                        votosActualesServidor = Object.keys(currentStatusSnapshot.val());
                    }

                    if (votosActualesServidor.includes(sanitizedName)) {
                        alert("Ya registraste un voto para esta persona anteriormente.");
                        voteBtn.disabled = false;
                        voteBtn.innerText = "VOTAR";
                        return;
                    }

                    if (votosActualesServidor.length >= 5) {
                        alert("Has alcanzado el límite máximo de 5 personas diferentes.");
                        location.reload();
                        return;
                    }
                }

                const currentVotes = globalVotesData[sanitizedName] || 0;
                const newVotesValue = currentVotes + 1;

                // 1. Guardado directo en el conteo numérico tradicional /Votos/Nombre
                await set(ref(db, `Votos/${sanitizedName}`), newVotesValue);

                // 2. Insertar historial estructurado con el nombre del votante, motivo y bandera de incógnito
                const newVoterLogRef = ref(db, `Detalles_Votos/${sanitizedName}/${currentSessionName}_${Date.now()}`);
                await set(newVoterLogRef, {
                    votante: currentSessionName,
                    motivo: rawReason,
                    votoIncognito: isIncognito
                });

                // 3. Registrar el voto actual dentro del historial de esta IP para controlar el tope de 5 diferentes
                if (userIpSanitized) {
                    await set(ref(db, `Historial_Votantes_IP/${userIpSanitized}/${sanitizedName}`), true);
                    // Dejar constancia general por IP para compatibilidad antigua si fuera requerido
                    await set(ref(db, `Ips_Votadas/${userIpSanitized}`), true);
                }

                // Actualizar arreglos locales de seguimiento de votos
                personasVotadasPorUsuario.push(sanitizedName);
                localStorage.setItem('voted_local_count', personasVotadasPorUsuario.length.toString());

                // Limpiar inputs de texto listos para el próximo voto si le quedan espacios
                nameInput.value = "";
                reasonInput.value = "";
                incognitoCheck.checked = false;

                // Si llegó al tope de 5, bloqueamos definitivamente la sección
                if (personasVotadasPorUsuario.length >= 5) {
                    hasVoted = true;
                    voteSection.style.display = 'none';
                    alreadyVotedMsg.innerText = "🔒 ¡Has completado tus 5 votos permitidos para personas diferentes exitosamente!";
                    alreadyVotedMsg.style.display = 'block';
                } else {
                    alert(`¡Voto registrado con éxito! Llevas ${personasVotadasPorUsuario.length} de 5 votos emitidos.`);
                    voteBtn.disabled = false;
                    voteBtn.innerText = "VOTAR";
                    actualizarContadorLabel();
                }

            } catch (error) {
                console.error("Error al votar: ", error);
                alert("Inconveniente: " + error.message);
                voteBtn.disabled = false;
                voteBtn.innerText = "VOTAR";
            }
        });

        // Intentar validar sesión de IP si ya ingresó nombre
        if (currentSessionName) {
            checkUserStatus();
        }
    </script>
</body>
</html>
